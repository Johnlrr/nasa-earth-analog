# Mission lenses — contract file (B0). Owner: Linh (B). Locked 13:45 14/11/2026.
# Each lens = one test question + operational footprint + descriptor set + ledger.
# Descriptor names MUST equal the dict keys returned by src/similitude/descriptors/*.
# min_scale = physical tolerance per descriptor (floor for the population std in fit_population).
#   number      -> absolute tolerance in descriptor units
#   {rel: x}    -> x * |target value| (resolved per target by the fidelity engine)

- id: L1
  name: Touchdown & Traverse
  body: moon
  question: "Where on Earth do slope/roughness distributions match the Artemis south-pole landing zones and LTV corridors?"
  footprint_km: 4            # EVA radius 2 km -> 4 km diameter; chip = footprint + 3 km buffer each side (10 km)
  chip_km: 10
  baseline: {type: dem_m, value: 30}
  pipeline: terrain
  descriptors: [slope_p50, slope_p90, frac_gt8, frac_gt15, frac_gt20,
                rms_s1, rms_s2, rms_s4, rms_s8, rms_s16, hurst]
  min_scale:
    slope_p50: 1.0
    slope_p90: 1.0
    frac_gt8: 0.05
    frac_gt15: 0.05
    frac_gt20: 0.05
    rms_s1: {rel: 0.1}
    rms_s2: {rel: 0.1}
    rms_s4: {rel: 0.1}
    rms_s8: {rel: 0.1}
    rms_s16: {rel: 0.1}
    hurst: 0.05
  gates: {ndvi_max: 0.15, bare_land: true}
  targets: [connecting_ridge, shackleton_rim]
  primary_target: connecting_ridge
  ledger: ledger/moon.yaml
  # A15 (Bao, 14/11 ~20:50, committed before build_verdicts.py first run): verdict variables.
  verdict_variables:
    slope_roughness:
      descriptors: [slope_p50, slope_p90, frac_gt8, frac_gt15, frac_gt20,
                    rms_s1, rms_s2, rms_s4, rms_s8, rms_s16, hurst]
      rule: "cell TRANSFERS when in the A12 robust set (native rank >= n_native/2 under configs i, ii, iii)"
  unobserved_variables:
    - "Metre-scale boulders and craters < 60 m: below the 30 m DEM baseline on both sides (LOLA 5 m maps cannot resolve 1-2 m boulders either)"

- id: L2
  name: Low-Sun Navigation
  body: moon
  question: "Where does the Sun skim the horizon over bare ground, casting long shadows like at the lunar south pole?"
  footprint_km: 4
  chip_km: 10
  baseline: {type: dem_m, value: 30}
  pipeline: terrain+astro
  descriptors: [lowsun_frac_daylight, lowsun_az_coverage, shadow_e2, shadow_e5, shadow_e7]
  descriptor_groups:
    astro: [lowsun_frac_daylight, lowsun_az_coverage]
    shadow: [shadow_e2, shadow_e5, shadow_e7]   # reported separately as d_shadow / sigma_shadow
  min_scale:
    lowsun_frac_daylight: 0.05
    lowsun_az_coverage: 0.05
    shadow_e2: 0.05
    shadow_e5: 0.05
    shadow_e7: 0.05
  gates: {ndvi_max: 0.15, bare_land: true, snow_free_lowsun_months: true}
  targets: [connecting_ridge, shackleton_rim]
  primary_target: connecting_ridge
  expectation_note: "Astro part very likely no-analog on Earth (needs lat >= ~83-86 deg). Valid result, reported as a number."
  ledger: ledger/moon.yaml
  # A15 (Bao, 14/11 ~20:50, committed before build_verdicts.py first run): verdict variables.
  verdict_variables:
    sun_geometry:
      descriptors: [lowsun_frac_daylight, lowsun_az_coverage]
      rule: "lens-level: NO-ANALOG when fidelity no_analog (best sigma > 2), value = best sigma"
    shadow_casting:
      descriptors: [shadow_e2, shadow_e5, shadow_e7]
      rule: "cell TRANSFERS when native_rank(d_shadow) >= n_native/2 (rank/seed cells only)"
  unobserved_variables:
    - "Horizon occlusion beyond 10 km: shadows are computed inside the 10 km chip only, on both sides"

- id: M1
  name: Aqueous Minerals & Biosignature
  body: mars
  question: "Where on Earth is the same water-altered mineral assemblage exposed today (carbonate, Fe/Mg-smectite, olivine, jarosite)?"
  footprint_km: 5
  baseline: {type: spectral_grid_nm, value: 10}
  pipeline: spectral
  spectral_subset: swir     # 1000-2490 nm; VNIR params excluded (MICA targets compared on SWIR only)
  # B14a (14/11 ~17:20, G1 review 2.4): HCPINDEX, BD2250, MIN2250 removed from fidelity because
  # they carry the CRISM-I/F vs EMIT-reflectance continuum bias (mean z -4..-7 on every Earth
  # cell); still reported in the bridge-bias table (A16). Decided AFTER seeing results ->
  # 'Deviations from pre-registration'.
  descriptors: [OLINDEX, LCPINDEX, BD1300, BD2100, BD2165, BD2190,
                BD2210, BD2230, BD2265, BD2290, D2300, BD2355, SINDEX,
                MIN2295_2480, MIN2345_2537]
  excluded_descriptors:
    BD1750: "14/11 B3: EMIT -0.01 fill starts ~1765 nm in recent scenes -> no right shoulder"
    HCPINDEX: "B14a: continuum-sensitive (CRISM I/F vs EMIT reflectance), bridge-bias table only"
    BD2250: "B14a: continuum-sensitive, bridge-bias table only"
    MIN2250: "B14a: continuum-sensitive, bridge-bias table only"
  min_scale: {default: 0.01}   # band depth tolerance, applies to every descriptor above

  # ---------------------------------------------------------------------------------------
  # B14a — PIXEL MATCH RULES (pre-registered: committed BEFORE any B13 pixel is computed).
  # Unit of comparison = one EMIT 60 m pixel (CRISM targeted 3x3 binned ~54 m: same scale).
  # ---------------------------------------------------------------------------------------
  pixel_match:
    source: "Viviano-Beck et al. 2014, JGR Planets 119:1403, doi:10.1002/2014JE004627, Table 3 (browse products)"
    # Diagnostic family per analog target = the browse-product parameters for that mineral class
    # that are measurable with the EMIT-usable common grid (external standard, not chosen from
    # our results). Parameters of the same browse product outside EMIT (BD1900_2, BD2500_2,
    # CINDEX2 at 3.9 um) cannot be used and are listed as unobserved.
    diagnostic:
      jezero_margin:
        mica_phase: MG_CARBONATE
        params: [MIN2295_2480, D2300]
        browse: "CR2 (MIN2295_2480; MIN2345_2537 and CINDEX2 not usable: target 0.011 at noise floor / beyond EMIT) + CAR (D2300; BD2500_2, BD1900_2 beyond EMIT or masked)"
        target_variant: {default: numerator}
        label: "Mg-carbonate / serpentine family (2.3 um only: the 2.5 um anchor sits at the EMIT edge, so serpentine and Mg-carbonate are not separable)"
        confidence: medium
      nili_fossae_olivine:
        mica_phase: FE_OLIVINE
        params: [OLINDEX]
        browse: "MAF (OLINDEX3; LCPINDEX2, HCPINDEX2 are pyroxene, not olivine diagnostics)"
        target_variant: {OLINDEX: ratioed}   # ratioed type spectrum isolates the 1 um band shape
        label: "olivine (broad 1 um band)"
        confidence: low
        flag: "continuum-sensitive: OLINDEX responds to red slopes / Fe-oxide coatings; low confidence"
    # A pixel MATCHES a target when EVERY diagnostic parameter is
    #   >= frac_of_target * (target value)   AND   >= noise_floor[param]
    frac_of_target: 0.5
    # noise_floor[param] = 95th percentile of that parameter over the NULL footprints' pixels,
    # minimum 0.01. Filled in B14b and committed BEFORE controls/decoys are run.
    noise_floor_quantile: 0.95
    noise_floor_min: 0.01
    # B14b (14/11 ~17:30): q95 of 69 null footprints (B5 null set, not re-drawn), ~490k valid
    # pixels each param; see data/derived/m1_null_quantiles.json. Committed BEFORE controls.
    # Known risk: desert null pixels can contain real caliche / clays (D2300 q95 0.110 is above
    # the Jezero target 0.080) -> conservative floor; reported in the validation report.
    noise_floor: {D2300: 0.11, MIN2295_2480: 0.0396, OLINDEX: 0.2734}
    # Pixel validity: same masks as emit_gee._valid_mask (aggregate_flag == 0, red > 0,
    # NIR > 0.08, NDVI < gates.ndvi_max, NDWI < 0); reflectance <= 0 (EMIT -0.01 fill) ignored.
    # Scene: the single EMIT scene with the MOST valid pixels in the footprint
    # (same rule as emit_gee.footprint_spectrum); no mixing of scenes.
    scene_rule: most_valid_pixels
    # Matched area: connected components of matched pixels, 8-connectivity; pixel area from the
    # EMIT grid at the footprint latitude. Outputs per (cell, target): n_valid_px, frac_matched,
    # matched_area_km2, largest_patch_km2, p50/p90/p99 of each diagnostic parameter.
    connectivity: 8
    # Pre-registered pass criteria (B13 stop rule at 21:00):
    #   control passes      when largest_patch_km2 >= 0.1
    #   decoy is rejected   when largest_patch_km2 <  0.1
    pass_largest_patch_km2: 0.1
    # Null footprints: the existing B5 null set (sample_role == null), not re-drawn.
  unobserved_variables:
    - "Hydration bands at 1.4 and 1.9 um: hidden by Earth's atmosphere in EMIT (CRISM's most sensitive water indicators)"
    - "Serpentine vs Mg-carbonate: not separable with 2.3 um alone (2.5 um anchor at the EMIT edge)"
  gates: {ndvi_max: 0.15, emit_coverage: true, lat_abs_max: 52, min_valid_pixels: 50}
  targets: [jezero_margin, oxia_planum, meridiani, nili_fossae_olivine]
  primary_target: jezero_margin
  # G1 review (docs/review_g1.md 3.1), decided 14/11 ~16:50 AFTER seeing results -> listed in
  # validation_report.md 'Deviations from pre-registration'. Discovery searches analogs only for
  # targets whose diagnostic band depths are measurable with EMIT-usable parameters.
  analog_targets: [jezero_margin, nili_fossae_olivine]
  unobserved_targets:
    oxia_planum: "FE_SMECTITE diagnostic depths (D2300 0.030, BD2290 0.015) are at the 0.01 tolerance floor: featureless basalt matches it (empty match). Verdict UNOBSERVED."
    meridiani: "JAROSITE diagnostic depths (BD2265 0.023, BD2210 0.011) are near the tolerance floor in EMIT-usable parameters. Verdict UNOBSERVED."
  population_note: "Sigma population = all usable MICA type spectra: variation BETWEEN mineral classes on Mars."
  ledger: ledger/mars.yaml

- id: X1
  name: Ice under Dry Overburden
  body: mars
  question: "Where is shallow ground ice preserved under a dry, cold overburden, for 1 m drill / GPR / neutron tests?"
  footprint_km: 10
  baseline: {type: grid_km, value: 10}
  pipeline: ice
  semiquantitative: true     # evidence_status capped at engine-semiquant
  descriptors: [permafrost_flag, ice_depth_ratio, aridity_p_pet, ft_cycles_yr]
  min_scale:
    permafrost_flag: 0.25
    ice_depth_ratio: 0.25
    aridity_p_pet: 0.05
    ft_cycles_yr: 10.0
  # permafrost_min added 14/11 13:45 AFTER the first provisional run: hot deserts (no ice) ranked
  # 5-12 because the Mars population includes ice-free sites. A lens about ice needs ice -> gate.
  gates: {ndvi_max: 0.15, bare_land: true, permafrost_min: 0.5}
  targets: [arcadia_planitia]
  primary_target: arcadia_planitia
  ledger_only_targets: [shackleton_psr]   # Moon side of X1 appears in ledger only
  # B15 (14/11 ~17:35, G1 review 3.2): X1 is reported as a 3-condition configuration checklist,
  # not as a similarity score. ALL thresholds below were set AFTER seeing the data ->
  # 'Deviations from pre-registration'. Reference site: Beacon Valley (buried ice under dry till).
  checklist:
    permafrost:
      rule: "maat_c <= -1"           # = permafrost_flag >= 0.5 (existing gate)
      basis: "permafrost_flag midpoint; Beacon Valley MAAT -40 C, Mars mid-latitude ~ -60 C"
    no_thaw_to_ice:                   # exclusion condition, not a similarity axis
      rule: "ft_yr <= 20"
      basis: "Mars: no liquid-water freeze-thaw at the surface (0). Beacon Valley 0; polar deserts 8-13 d/yr; registered wet-permafrost decoys 33-37; Tibet/Pamir 160-230. 20 d/yr chosen after seeing these values."
    dry_overburden:
      rule: "aridity_p_pet <= 0.5"
      basis: "UNEP aridity-index upper bound of the semi-arid class (0.5), applied to P / max(PET, 500 mm) (PET floor, see descriptors/ice.py). Beacon Valley 0.21; Mars 0."
    data_notes:
      - "MAAT: ERA5-Land soil temperature 28-100 cm = reanalysis model output on a ~9 km grid, not an observation"
      - "Freeze-thaw days: MODIS clear-sky land-surface temperature (day > 0 C and night < 0 C)"
  unobserved_variables:
    - "Overburden dielectric properties (radar / GPR response): no global Earth dataset matched to SWIM radar observables"
  ledger: ledger/mars.yaml
