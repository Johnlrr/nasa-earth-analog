# M1 seed footprints (B5). Owner: Linh (B). Separate from config/seeds.yaml (Bao, terrain lenses).
# Seeds are HYPOTHESES fed to the engine, never results: a seed is published only if the engine
# confirms it. Every seed must lie inside EMIT coverage (|lat| <= 52). Coordinates approximate the
# bare outcrop; the engine picks the best EMIT scene and masks vegetation / water itself.
# class: ophiolite (olivine/serpentine/carbonate), basalt (mafic), evaporite (salts/sulfates),
#        acid_sulfate (jarosite), clay (smectite/kaolinite sediments)

