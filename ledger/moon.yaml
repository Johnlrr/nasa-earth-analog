body: moon
lens_ids: [L1, L2, X1]
updated: 2026-11-14
items:
  - id: gravity
    variable: gravity
    quantity: Surface gravity
    earth: {value: 9.82, unit: m/s^2}
    target: {value: 1.62, unit: m/s^2}
    ratio_target_over_earth: 0.165
    consequence: "Slope geometry transfers; wheel sinkage, traction and dust ballistics do not."
    mitigation: "Reduced-gravity offload rig, parabolic flight"
    facility: "Reduced-gravity offload rig, parabolic flight"
    applies_to: [L1, L2, X1]
    source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html"
    source_note: "Fact sheet 'Surface gravity (m/s2)' = 1.62; Earth mean 9.820 from https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html"
  - id: angle_of_repose
    variable: angle_of_repose
    quantity: Angle of repose of loose granular material (gravity dependence)
    earth: {value: 40, unit: deg, note: "angular grains, time-averaged at 1 g"}
    target: {value: null, unit: deg, note: "tested at 0.1 g, 0.38 g and 1 g (not exactly 0.165 g); static angle rises ~5 deg and dynamic angle falls ~10 deg in reduced gravity"}
    ratio_target_over_earth: null
    consequence: "Terrestrial slope stability and avalanche size do not transfer 1:1; reduced gravity gives larger avalanches (static up ~5 deg, dynamic down ~10 deg)."
    mitigation: "Parabolic-flight drum tests or gravity-offload slope tests with the actual simulant"
    facility: "Parabolic-flight drum tests or gravity-offload slope tests with the actual simulant"
    applies_to: [L1]
    source: "https://doi.org/10.1029/2011JE003865"
    source_note: "Kleinhans et al. 2011, JGR Planets 116, E11004; numbers from abstract (read via https://dare.uva.nl/id/18109ef6-2d5a-4280-9181-072ce10b5238). A later study of Martian dunes reportedly disputes gravity dependence."
  - id: atmospheric_pressure
    variable: atmospheric_pressure
    quantity: Surface pressure
    earth: {value: 101400, unit: Pa, note: "1014 mb"}
    target: {value: 3.0e-10, unit: Pa, note: "3e-15 bar (night); ~2e5 particles/cm3"}
    ratio_target_over_earth: 3.0e-15
    consequence: "No convective cooling, no gas drag on dust and no ice sublimation damping, so any test in air misses these effects."
    mitigation: "Thermal-vacuum chamber with regolith simulant"
    facility: "Thermal-vacuum chamber with regolith simulant"
    applies_to: [L1, L2, X1]
    source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html"
    source_note: "Fact sheet 'Surface pressure (night): 3 x 10-15 bar (2 x 10-12 torr)'; Earth 1014 mb from earthfact.html"
  - id: day_night_cycle
    variable: day_night_cycle
    quantity: Solar day (synodic period)
    earth: {value: 24.0, unit: h}
    target: {value: 29.53, unit: d, note: "synodic period, ~708.7 h"}
    ratio_target_over_earth: 29.6
    consequence: "Multi-day lunar night and its thermal soak cannot be reproduced outdoors on Earth."
    mitigation: "Thermal-vacuum cycling of hardware"
    facility: "Thermal-vacuum cycling of hardware"
    applies_to: [L2, X1]
    source: "https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html"
    source_note: "Fact sheet 'Synodic period (days)' = 29.53; Earth length of day 24.0000 h from earthfact.html"
  - id: radiation_dose
    variable: radiation_dose
    quantity: Surface radiation dose equivalent rate
    earth: {value: 0.0066, unit: mSv/day, note: "2.4 mSv/yr worldwide average natural background (UNSCEAR 2008) divided by 365"}
    target: {value: 1.369, unit: mSv/day, note: "Chang'e-4 LND, charged-particle dose equivalent, average; ISS interior 0.731 mSv/day in same paper"}
    ratio_target_over_earth: 208
    consequence: "Cumulative dose and single-event effects on electronics cannot be reproduced by any field site."
    mitigation: "Accelerator or isotope-source irradiation of components"
    facility: "Accelerator or isotope-source irradiation of components"
    applies_to: [L1, L2, X1]
    source: "https://doi.org/10.1126/sciadv.aaz1334"
    source_note: "Zhang et al. 2020 Sci. Adv. 6(39):eaaz1334, full text https://pmc.ncbi.nlm.nih.gov/articles/PMC7518862/ ('average dose equivalent of 1369 uSv/day'). Earth value: https://www.cnsc-ccsn.gc.ca/eng/resources/fact-sheets/natural-background-radiation/ (cites UNSCEAR 2008). 2.4 mSv/yr is a world average."
  - id: temperature
    variable: temperature
    quantity: Surface temperature
    earth: {value: 288, unit: K, note: "global mean"}
    target: {value: 100, unit: K, note: "upper bound: permanently shadowed polar terrain well below 100 K; equatorial diurnal range 95-390 K"}
    ratio_target_over_earth: null
    consequence: "Earth ice sits near its melting point while PSR ice is deep-cryogenic with very different mechanical behavior, so strength and drilling response do not transfer."
    mitigation: "Cryogenic test bench for ice-regolith drilling and mobility"
    facility: "Cryogenic test bench for ice-regolith drilling and mobility"
    applies_to: [L2, X1]
    source: "https://ntrs.nasa.gov/citations/20110011329"
    source_note: "Paige et al. 2010 Science 330:479 (doi 10.1126/science.1187726), abstract: 'large areas of lunar polar terrain with surface temperatures well below 100K'. Equatorial 95-390 K and Earth 288 K from the NSSDC fact sheets. The '<110 K' wording in DESIGN.md was not found in Paige 2010 and is dropped."
  - id: diffuse_skylight
    variable: diffuse_skylight
    quantity: Atmospheric diffuse skylight
    earth: {value: null, unit: null, note: "atmosphere scatters sunlight into shadows"}
    target: {value: 0, unit: null, note: "essentially none; exosphere ~2e5 particles/cm3, black sky"}
    ratio_target_over_earth: null
    consequence: "Shadows on Earth are filled by skylight, so low-sun optical and navigation tests transfer only partly."
    mitigation: "Add artificial single-source lighting with black enclosures, or night tests"
    facility: "Add artificial single-source lighting with black enclosures, or night tests"
    applies_to: [L2]
    source: "https://science.nasa.gov/moon/sun-and-weather-overview/weather-on-the-moon/"
    source_note: "NASA: 'pitch-black sky'; exosphere cannot spread the Sun's energy so sunlit/shadowed differences are extreme. Particle density from moonfact.html. Qualitative only; no numeric skylight value verified."
  - id: regolith_dust
    variable: regolith_dust
    quantity: Regolith and dust material properties
    earth: {value: null, unit: null, note: "water- and weather-processed natural soils"}
    target: {value: null, unit: null, note: "micrometeorite-generated agglutinated, jagged particles; observed levitation at the terminator"}
    ratio_target_over_earth: null
    consequence: "Abrasion, adhesion and dust levitation do not transfer; Earth soil is a poor stand-in, so simulants are required."
    mitigation: "Use lunar simulant under vacuum; do not claim wear or adhesion results from field soil"
    facility: "Use lunar simulant under vacuum; do not claim wear or adhesion results from field soil"
    applies_to: [L1, X1]
    source: "https://ntrs.nasa.gov/api/citations/20205001806/downloads/CJW%20PIO%20Dust%20Manuscript_V011.docx.pdf"
    source_note: "Wohl et al. (NASA Langley), introduction: 'many of the particles consists of agglutinated smaller particles, often forming complex, jagged conformations'; levitation at terminator. The same paper estimates electrostatic adhesion is weak vs van der Waals, so 'electrostatically charged' is contested and not asserted here."
nasa_gaps:
