    relevance: "No field analog reproduces multi-day lunar night in vacuum (day_night_cycle, temperature)."
    source: "https://www.nationalacademies.org/cdn/materials/a055a45c-1f83-41ad-8b66-29153f296b14"
  - id: "ESDMD #0801"
    name: "Lunar Dust Tolerant Systems and Dust Mitigation"
    relevance: "Linked to regolith_dust and atmospheric_pressure."
    source: "https://www.nationalacademies.org/cdn/materials/a055a45c-1f83-41ad-8b66-29153f296b14"
  - id: "ESDMD #0805"
    name: "Autonomous Surface Mobility and Navigation"
    relevance: "Linked to gravity, angle_of_repose and diffuse_skylight (L1, L2)."
    source: "https://www.nationalacademies.org/cdn/materials/a055a45c-1f83-41ad-8b66-29153f296b14"
  - id: "ESDMD #1101"
    name: "Lunar Precision Landing and Hazard Avoidance for Human Exploration"
    relevance: "Linked to the touchdown terrain lens (L1)."
    source: "https://www.nationalacademies.org/cdn/materials/a055a45c-1f83-41ad-8b66-29153f296b14"
  - id: "ESDMD #0603"
    name: "Water Recovery from Lunar Regolith/Ice"
    relevance: "Linked to the ice-under-dry-overburden lens (X1) and the temperature item."
    source: "https://www.nationalacademies.org/cdn/materials/a055a45c-1f83-41ad-8b66-29153f296b14"
  - id: "ESDMD #0307"
    name: "Radiation Monitoring and Modeling"
    relevance: "Linked to radiation_dose."
    source: "https://www.nationalacademies.org/cdn/materials/a055a45c-1f83-41ad-8b66-29153f296b14"
