<!doctype html><html><head><meta charset="utf-8"><style>body{font:18px system-ui;background:#101824;color:#dfeaff;padding:24px}iframe{width:100%;height:500px;border:1px solid #526}li{margin:12px}h1{font-size:24px}</style></head><body><h1>SIMILITUDE browser interaction checks</h1><ol id="results"></ol><iframe src="/web/campaign.html" title="Campaign UI"></iframe><script>
const frame=document.querySelector('iframe'), results=document.querySelector('#results');
function check(ok,label){const li=document.createElement('li');li.textContent=(ok?'PASS: ':'FAIL: ')+label;li.style.color=ok?'#96ddba':'#ff9090';results.append(li);if(!ok)throw new Error(label)}
frame.onload=async()=>{try{const w=frame.contentWindow,d=w.document;let i=0;while(!d.querySelector('[data-select]')&&i++<100)await new Promise(r=>setTimeout(r,100));check(d.querySelectorAll('[data-select]').length===3,'Three published candidates load');
d.querySelectorAll('[data-select][aria-pressed="true"]').forEach(b=>b.click());d.querySelector('#guided-demo').click();check(d.querySelector('#selection-count').textContent==='1','Worked example selects terrain footprint');let matrix=d.querySelector('#test-matrix').textContent;check(matrix.includes('Modelled evidence')&&matrix.includes('Evidence gap'),'Evidence gaps remain visible');
d.querySelector('[data-select="site:E10K_244_-1498"]').click();check(d.querySelector('#selection-count').textContent==='2','Add shadow footprint');check(d.querySelectorAll('.matrix-row .observed').length===2,'Both supported variables appear; hardware response stays unresolved');
let route=d.querySelector('#route-notes');route.value='Survey route A <script>unsafe<\/script>';route.dispatchEvent(new w.Event('input',{bubbles:true}));check(JSON.parse(w.localStorage.getItem('similitude.review-draft.v1')).route===route.value,'Notes persist locally');
const blobs=[];w.URL.createObjectURL=blob=>{blobs.push(blob);return 'blob:test'};w.HTMLAnchorElement.prototype.click=function(){};d.querySelector('#download-brief').click();d.querySelector('#download-data').click();check(blobs.length===2,'Both exports create downloadable blobs');const html=await blobs[0].text(),pack=JSON.parse(await blobs[1].text());check(pack.selected_footprints.length===2&&pack.source.sha256.length===64,'JSON retains selections and dataset hash');check(html.includes('&lt;script&gt;')&&!html.includes('<script>unsafe'),'Review export escapes user notes');check(pack.proposed_route_or_setup.geometry===null,'No invented route geometry');
d.querySelector('[data-select="site:E10K_244_-1498"]').click();check(d.querySelectorAll('.matrix-row .observed').length===1,'Removing a footprint removes its evidence');d.querySelector('#mission-task').value='terrain';d.querySelector('#mission-task').dispatchEvent(new w.Event('change'));check(d.querySelector('#objective-count').textContent==='3','Mission change updates objectives');
const m=d.querySelector('.menu-toggle');m.click();check(m.getAttribute('aria-expanded')==='true','Menu opens with accessible state');d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape'}));check(m.getAttribute('aria-expanded')==='false','Escape closes menu');
await Promise.all([...d.images].map(im=>{im.loading='eager';return im.decode().catch(()=>{});}));check([...d.images].every(im=>im.complete&&im.naturalWidth>0),'All UI images loaded');
check(d.documentElement.scrollWidth <= w.innerWidth, 'No horizontal page overflow');
const objectiveInputs=[...d.querySelectorAll('.objective-list input:checked')];objectiveInputs.forEach(el=>el.click());check(d.querySelector('#download-brief').disabled&&d.querySelector('#test-matrix').textContent.includes('Choose at least'),'Empty objectives disable export and explain the next action');
objectiveInputs.forEach(el=>el.click());check(!d.querySelector('#download-brief').disabled,'Restoring objectives enables export');
const named=d.querySelector('#campaign-name');named.value='Long review title '.repeat(5);named.dispatchEvent(new w.Event('input',{bubbles:true}));check(d.documentElement.scrollWidth<=w.innerWidth,'Long campaign names remain contained');
named.focus();check(d.activeElement===named&&w.getComputedStyle(named).outlineStyle!=='none','Keyboard focus has a visible outline');
check(!d.querySelector('script[src*=moment]')&&!d.querySelector('[data-moment]'),'No decorative motion runtime');
const errorFrame=document.createElement('iframe');errorFrame.title='Error state check';errorFrame.style.height='300px';document.body.append(errorFrame);
const errorLoad=new Promise(resolve=>errorFrame.onload=resolve);let page=await fetch('/web/campaign.html').then(r=>r.text());page=page.replace('<head>','<head><base href="/web/">').replace('<script src="campaign.js" defer>', '<script>window.fetch=()=>Promise.reject(new Error("QA controlled load failure"));<'+ '/script><script src="campaign.js" defer>');errorFrame.srcdoc=page;await errorLoad;await new Promise(r=>setTimeout(r,200));const ed=errorFrame.contentDocument;
check(ed.querySelector('#load-status').getAttribute('role')==='alert'&&ed.querySelector('#load-status').textContent.includes('could not be loaded'),'Data failure presents an accessible error');
check(ed.querySelector('#download-brief').disabled&&ed.querySelector('#candidate-grid').getAttribute('aria-busy')==='false','Failed load ends loading state and keeps export disabled');
document.documentElement.dataset.ready='true';}catch(e){check(false,e.message)}};
</script></body></html>
