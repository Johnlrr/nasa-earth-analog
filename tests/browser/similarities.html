<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Similarities live checks</title><style>body{background:#101719;color:#f1eee6;font:16px/1.6 system-ui;margin:24px}li{margin:6px 0}.pass{color:#91d3ab}.fail{color:#ff9b89}iframe{width:100%;height:650px;border:1px solid #344144}</style></head><body><h1>Similarities / source-bound terrain comparison</h1><p id="status">Running…</p><ol id="checks"></ol><iframe title="Actual paired-terrain UI" src="/web/explorer.html"></iframe><script>
const results=[],frame=document.querySelector('iframe'),wait=ms=>new Promise(r=>setTimeout(r,ms));
function check(ok,label){results.push({ok:!!ok,label});const li=document.createElement('li');li.textContent=(ok?'PASS ':'FAIL ')+label;li.className=ok?'pass':'fail';document.querySelector('#checks').append(li);if(!ok)throw Error(label)}
async function until(fn){for(let i=0;i<150;i++){if(fn())return;await wait(50)}throw Error('State timed out')}
window.addEventListener('load',async()=>{try{
 const w=frame.contentWindow,d=w.document;await until(()=>d.documentElement.dataset.ready==='ready');const api=w.SimilitudeExplorer;
 d.querySelector('[data-terrain-example]').click();await wait(90);check(api.getState().selectedId==='site:E10K_453_921'&&api.getState().lens==='SITES','Terrain example opens the actual Da Qaidam site in the existing engine');
 await Promise.all([...d.querySelectorAll('.terrain-image img')].map(im=>im.decode()));
 check(d.querySelectorAll('.terrain-image img').length===2&&[...d.querySelectorAll('.terrain-image img')].every(i=>i.naturalWidth>0),'Both real target/Earth terrain images load');
 check(d.querySelector('.terrain-half.target img').src.includes('connecting-ridge')&&d.querySelector('.terrain-half.earth img').src.includes('qaidam'),'Displayed images match the recorded target and exact Earth cell');
 check(d.querySelectorAll('.comparison-table tbody tr').length===11,'Regional group exposes all eleven published terrain descriptors for its exact member');
 check(d.querySelector('.discovery').textContent.includes('What aligns')&&d.querySelector('.discovery').textContent.includes('What remains unknown'),'Dynamic interpretation precedes raw technical evidence'); const sf=d.querySelector('.signature-feature');sf.querySelector('summary').click();check(sf.open&&sf.textContent.includes('recorded z'),'Signature feature reveals raw values with native keyboard disclosure'); check(!d.querySelector('.technical-evidence').open,'Full numeric table remains available without leading the discovery');
 const cell=api.getState().features.find(f=>f.properties.id==='L1-E10K_453_921'),value=cell.properties.lens_scores.L1.descriptors.slope_p50;
 check(d.querySelector('.comparison-table tbody tr td:nth-child(2) .metric-value').textContent===value.earth.toFixed(3)&&d.querySelector('.comparison-table tbody tr td:nth-child(3) .metric-value').textContent===value.target.toFixed(3),'Median slopes remain exact source values');
 const tracks=d.querySelectorAll('.comparison-table tbody tr:first-child .metric-track');check(tracks[0].dataset.min===tracks[1].dataset.min&&tracks[0].dataset.max===tracks[1].dataset.max,'Earth and target visual bars share one numeric row scale');
 check(d.querySelector('.engineering-gaps').textContent.includes('Relative humidity')&&d.querySelector('.engineering-gaps').textContent.includes('Soil moisture')&&d.querySelectorAll('.engineering-gaps td:nth-child(2)').length>=4&&[...d.querySelectorAll('.engineering-gaps td:nth-child(2)')].every(td=>td.textContent==='Not available'),'Humidity and soil-water gaps are visible without fabricated measurements');
 check(d.querySelector('.environment-table').textContent.includes('3.00e-10 Pa')&&d.querySelector('.environment-table').textContent.includes('9.820'),'Planetary reference table retains tiny lunar pressure and actual gravity values');
 check(d.querySelector('.terrain-provenance').textContent.includes('not co-registered')&&d.querySelector('.terrain-half.target figcaption').textContent.includes('not a photograph'),'Image modality, scale and provenance limits are visible');
 let select=d.querySelector('#terrain-context');const original=select.value;select.selectedIndex=1;select.dispatchEvent(new w.Event('change',{bubbles:true}));
 check(!d.querySelector('.comparison-table')&&d.querySelector('.criteria-unavailable').textContent.includes('does not publish'),'A different target without descriptors never inherits the first target values');
 check(!d.querySelector('.terrain-half.earth img'),'An unpublished member image never reuses another cell photograph');
 d.querySelector('#terrain-context').value=original;d.querySelector('#terrain-context').dispatchEvent(new w.Event('change',{bubbles:true}));
 check(api.getState().selectedId==='site:E10K_453_921'&&d.querySelector('.comparison-table'),'Switching detailed context preserves the selected map/list site');
 const im=d.querySelector('.terrain-half.earth img');im.dispatchEvent(new w.Event('error'));check(im.hidden&&!d.querySelector('.terrain-half.earth .image-unavailable').hidden,'Broken image has a readable fallback without dropping measured evidence');
 d.querySelector('#terrain-context').dispatchEvent(new w.Event('change',{bubbles:true}));
 d.querySelector('[data-comparison-cell]').click();await wait(80);check(api.getState().lens==='L1'&&api.getState().selectedId==='L1-E10K_453_921','Open footprint uses canonical engine lens and cell selection');
 d.querySelector('#open-dossier').click();await wait(60);d.querySelector('#close-dossier').click();await wait(60);check(!d.querySelector('#comparison').hidden&&d.querySelectorAll('.terrain-image img').length===2,'Evidence/back retains the same actual terrain pair');
 for(const width of [1440,768,390,320]){frame.style.width=width+'px';await wait(100);check(d.documentElement.scrollWidth<=w.innerWidth,'Comparison has no page overflow at '+width+' px');check(d.querySelector('.table-scroll').scrollWidth>=d.querySelector('.table-scroll').clientWidth,'Detailed criteria remain accessible in their own scroll region at '+width+' px');}
 frame.style.width='100%';check(!results.some(r=>!r.ok),'All similarities checks completed');
}catch(err){if(!results.some(r=>!r.ok))check(false,err.message)}finally{const failed=results.filter(r=>!r.ok).length;document.querySelector('#status').textContent=results.length+' checks / '+failed+' failed';document.documentElement.dataset.ready=failed?'failed':'passed';window.qaResults=results;}});
</script></body></html>
