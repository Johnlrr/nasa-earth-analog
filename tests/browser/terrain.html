<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#101719;color:#f1eee6;font:16px/1.6 system-ui;margin:24px}iframe{width:100%;height:700px;border:1px solid #344144}.pass{color:#92d5aa}.fail{color:#ff9b89}</style></head><body><h1>Terrain exploration / real browser checks</h1><p id="status">Running</p><ol id="results"></ol><iframe src="/web/explorer.html" title="Actual terrain explorer"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('#results'),checks=[],wait=ms=>new Promise(r=>setTimeout(r,ms));function check(ok,label){checks.push({ok,label});const li=document.createElement('li');li.textContent=(ok?'PASS ':'FAIL ')+label;li.className=ok?'pass':'fail';out.append(li);if(!ok)throw Error(label)}
window.addEventListener('load',async()=>{try{const w=frame.contentWindow,d=w.document;for(let i=0;i<200&&d.documentElement.dataset.ready!=='ready';i++)await wait(50);d.querySelector('[data-terrain-example]').click();await wait(100);check(d.querySelectorAll('.terrain-lab canvas').length===2,'Actual Earth and target DEM canvases render');check(d.querySelector('.worlds-heading').textContent.includes('Compare two worlds'),'Landscape comparison has its own visual chapter');check(d.querySelectorAll('.terrain-half')[0].classList.contains('earth'),'Earth remains left and target right');const original=d.querySelector('.terrain-readout').textContent;const row=d.querySelector('[data-terrain-row]');row.value=20;row.dispatchEvent(new w.Event('input',{bubbles:true}));check(d.querySelector('.terrain-readout').textContent!==original,'Moving transect changes the actual elevation readings');const layer=d.querySelector('[data-terrain-layer]');layer.value='slope';layer.dispatchEvent(new w.Event('change',{bubbles:true}));check(d.querySelector('[data-terrain-legend]').textContent.includes('not a hazard map'),'Slope layer has numeric units without invented hazard classes');const contour=d.querySelector('[data-terrain-contours]');contour.click();check(!contour.checked,'Contours toggle independently');const cursor=d.querySelector('[data-terrain-cursor]');cursor.value=80;cursor.dispatchEvent(new w.Event('input',{bubbles:true}));check(d.querySelector('.terrain-readout').textContent.includes('3.20 km'),'Cursor position maps to actual source-grid distance');check(d.querySelector('.elevation-profile svg').getAttribute('role')==='img','Elevation graphic has accessible description');check(d.querySelector('.terrain-method').textContent.includes('not the same geographic azimuth'),'Different raster orientations are disclosed');const before=w.SimilitudeExplorer.getState().selectedId;d.querySelector('#open-dossier').click();await wait(50);d.querySelector('#close-dossier').click();await wait(50);check(w.SimilitudeExplorer.getState().selectedId===before&&d.querySelectorAll('.terrain-lab canvas').length===2,'Evidence and back preserve source selection');for(const width of [1440,768,390,320]){frame.style.width=width+'px';await wait(70);check(d.documentElement.scrollWidth<=w.innerWidth,'Terrain inspector has no page overflow at '+width+' px')}frame.style.width='100%';w.SimilitudeExplorer.setLens('M1');w.SimilitudeExplorer.select(w.SimilitudeExplorer.getState().visible[0].properties.id,false);check(!d.querySelector('.terrain-lab')&&d.querySelector('.terrain-no-grid'),'Missing DEM shows compact unavailable state instead of fabricated elevations');check(!checks.some(c=>!c.ok),'All terrain checks completed');}catch(e){if(!checks.some(c=>!c.ok))check(false,e.message)}finally{document.querySelector('#status').textContent=checks.length+' checks / '+checks.filter(c=>!c.ok).length+' failed';document.documentElement.dataset.ready='true';}});
</script></body></html>
